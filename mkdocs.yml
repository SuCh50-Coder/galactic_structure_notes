site_name: MS Notebook | SuCh
site_url: https://sitename.example
theme:
  name: material
  font:
    text: Lexend
    code: Fira Code
  icon:
    logo: simple/starship
  favicon: assets/favicon_sc.png
  features:
    - navigation.footer

  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: lime
      accent: light green

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: indigo
      accent: blue grey
  

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - admonition
  - pymdownx.details

extra:
  social:
    - icon: material/web
      link: https://www.susnata.com/
    - icon: fontawesome/brands/github
      link: https://github.com/SuCh50-Coder
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/susnata-chatterjee077/
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@theconfastroph
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/susnata.chatterjee.20


